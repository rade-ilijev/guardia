name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      - name: Build (play debug)
        run: ./gradlew :app:assemblePlayDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testFullDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintFullDebug --stacktrace

      # Job logs and artifacts both need repository admin rights to read, even though this repo
      # is public. The run summary does not, so the failures go there: whoever opens the red run
      # sees what broke without downloading anything.
      # Job logs and artifacts both need repository admin rights to read, even though this repo
      # is public. Annotations and the run summary do not, so the failures go to both: whoever
      # opens the red run sees what broke without downloading anything or being an admin.
      - name: Report lint failures
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          out = open(summary_path, "a", encoding="utf-8") if summary_path else None

          def say(line=""):
              if out:
                  out.write(line + "\n")

          def annotate(text, file=None, line=None):
              # A workflow command on stdout becomes an annotation on the run page.
              where = ""
              if file:
                  where = " file=" + file + (",line=" + line if line else "")
              print("::error" + where + "::" + text.replace("\n", " "))

          reports = sorted(glob.glob("app/build/reports/lint-results-*.xml"))
          say("## Lint")
          if not reports:
              say("No lint XML report under app/build/reports (cwd " + os.getcwd() + ").")
              annotate("Lint failed but produced no XML report to parse.")
          for path in reports:
              try:
                  issues = ET.parse(path).getroot().findall("issue")
              except Exception as exc:
                  say("Could not parse " + path + ": " + str(exc))
                  continue
              blocking = [i for i in issues if i.get("severity") in ("Error", "Fatal")]
              say("`" + path + "` - " + str(len(blocking)) + " blocking, "
                  + str(len(issues) - len(blocking)) + " non-blocking")
              say()
              by_id = {}
              for issue in blocking:
                  by_id.setdefault(issue.get("id"), []).append(issue)
              for issue_id, group in sorted(by_id.items(), key=lambda kv: -len(kv[1])):
                  loc = group[0].find("location")
                  f = loc.get("file") if loc is not None else None
                  ln = loc.get("line") if loc is not None else None
                  annotate("lint " + issue_id + " x" + str(len(group)) + ": " + (group[0].get("message") or ""), f, ln)
                  say("### `" + issue_id + "` x" + str(len(group)))
                  say("> " + (group[0].get("message") or ""))
                  say()
                  for issue in group[:12]:
                      l = issue.find("location")
                      where = "?"
                      if l is not None:
                          where = (l.get("file") or "?").split("guardia/guardia/")[-1]
                          if l.get("line"):
                              where += ":" + l.get("line")
                      say("- `" + where + "`")
                  if len(group) > 12:
                      say("- ...and " + str(len(group) - 12) + " more")
                  say()
          if out:
              out.close()
          EOF

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-*.*
